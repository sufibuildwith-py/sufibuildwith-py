<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">Engineering proof strip</title><desc id="desc">Four glossy cards showing Sentinel and GuideIn validation metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#080a0f"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".13"/><stop offset="1" stop-color="#ffffff" stop-opacity=".025"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6"/><stop offset=".52" stop-color="#60a5fa"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  </defs>
  <rect width="1200" height="180" rx="30" fill="url(#bg)"/>
  <rect x="20" y="20" width="275" height="140" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".12"/><rect x="315" y="20" width="275" height="140" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".12"/><rect x="610" y="20" width="275" height="140" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".12"/><rect x="905" y="20" width="275" height="140" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".12"/>
  <g font-family="Inter,Segoe UI,sans-serif">
    <text x="48" y="68" fill="#ffffff" font-size="36" font-weight="750">464</text><text x="48" y="98" fill="#9ca3af" font-size="13" letter-spacing="1">SENTINEL SCENARIOS</text><text x="48" y="128" fill="#a7f3d0" font-size="12">fixed-seed proof</text>
    <text x="343" y="68" fill="#ffffff" font-size="36" font-weight="750">432/432</text><text x="343" y="98" fill="#9ca3af" font-size="13" letter-spacing="1">POLICY CASES</text><text x="343" y="128" fill="#a7f3d0" font-size="12">100% compliant</text>
    <text x="638" y="68" fill="#a7f3d0" font-size="36" font-weight="750">0</text><text x="638" y="98" fill="#9ca3af" font-size="13" letter-spacing="1">UNSAFE ACTIONS</text><text x="638" y="128" fill="#a7f3d0" font-size="12">guardrails held</text>
    <text x="933" y="68" fill="#ffffff" font-size="36" font-weight="750">96%</text><text x="933" y="98" fill="#9ca3af" font-size="13" letter-spacing="1">GUIDEIN RELIABILITY</text><text x="933" y="128" fill="#a7f3d0" font-size="12">48 / 50 requests</text>
  </g>
  <rect x="20" y="174" width="1160" height="2" rx="1" fill="url(#line)"><animate attributeName="opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite"/></rect>
</svg>
