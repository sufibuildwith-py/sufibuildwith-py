<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Sufiyan OS profile hero</title>
  <desc id="desc">Glassy interface introducing Sufiyan Khan as an AI engineer and backend builder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07090f"/><stop offset=".52" stop-color="#12131b"/><stop offset="1" stop-color="#080a0f"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".17"/><stop offset=".45" stop-color="#ffffff" stop-opacity=".055"/><stop offset="1" stop-color="#ffffff" stop-opacity=".025"/></linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".55"/><stop offset=".45" stop-color="#8b5cf6" stop-opacity=".22"/><stop offset="1" stop-color="#34d399" stop-opacity=".38"/></linearGradient>
    <radialGradient id="violet"><stop stop-color="#8b5cf6" stop-opacity=".52"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="mint"><stop stop-color="#34d399" stop-opacity=".4"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="36"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity=".62"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
    <clipPath id="windowClip"><rect x="36" y="34" width="1128" height="372" rx="30"/></clipPath>
  </defs>
  <rect width="1200" height="440" rx="38" fill="url(#bg)"/>
  <circle cx="205" cy="90" r="190" fill="url(#violet)" filter="url(#blur)"><animate attributeName="cx" values="205;300;205" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="1010" cy="354" r="220" fill="url(#mint)" filter="url(#blur)"><animate attributeName="cy" values="354;275;354" dur="12s" repeatCount="indefinite"/></circle>
  <rect width="1200" height="440" rx="38" fill="url(#grid)"/>
  <g filter="url(#shadow)">
    <rect x="36" y="34" width="1128" height="372" rx="30" fill="url(#glass)" stroke="url(#stroke)"/>
    <g clip-path="url(#windowClip)"><path d="M-80 402L540 24H750L130 402Z" fill="#ffffff" opacity=".035"><animateTransform attributeName="transform" type="translate" values="-420 0;1380 0" dur="7s" repeatCount="indefinite"/></path></g>
  </g>
  <circle cx="66" cy="64" r="7" fill="#ff5f57"/><circle cx="90" cy="64" r="7" fill="#febc2e"/><circle cx="114" cy="64" r="7" fill="#28c840"/>
  <text x="600" y="69" text-anchor="middle" fill="#e5e7eb" opacity=".72" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="600" letter-spacing="2">SUFIYAN OS  /  PROFILE</text>
  <circle cx="1090" cy="64" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="1105" y="69" fill="#d1fae5" font-family="Inter,Segoe UI,sans-serif" font-size="12">OPEN TO WORK</text>
  <text x="84" y="144" fill="#a7f3d0" font-family="JetBrains Mono,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="3">HELLO, I'M SUFIYAN</text>
  <text x="80" y="213" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="58" font-weight="720" letter-spacing="-2">AI engineer.</text>
  <text x="80" y="273" fill="#d1d5db" font-family="Georgia,serif" font-size="53" font-style="italic">Systems builder.</text>
  <text x="84" y="318" fill="#9ca3af" font-family="Inter,Segoe UI,sans-serif" font-size="17">Agentic reasoning × deterministic guardrails × software that ships.</text>
  <g transform="translate(760 120)">
    <rect width="344" height="224" rx="24" fill="#0a0c12" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".15"/>
    <text x="26" y="38" fill="#9ca3af" font-family="JetBrains Mono,Consolas,monospace" font-size="11" letter-spacing="2">CURRENT BUILD / SENTINEL</text>
    <line x1="26" y1="56" x2="318" y2="56" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="26" y="103" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="700">464</text><text x="26" y="126" fill="#9ca3af" font-family="Inter,Segoe UI,sans-serif" font-size="12">proof scenarios</text>
    <text x="134" y="103" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="27" font-weight="700">432/432</text><text x="134" y="126" fill="#9ca3af" font-family="Inter,Segoe UI,sans-serif" font-size="12">policy cases</text>
    <text x="280" y="103" fill="#a7f3d0" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="700">0</text><text x="280" y="126" fill="#9ca3af" font-family="Inter,Segoe UI,sans-serif" font-size="12">unsafe</text>
    <rect x="26" y="157" width="292" height="8" rx="4" fill="#ffffff" fill-opacity=".08"/>
    <rect x="26" y="157" width="292" height="8" rx="4" fill="#34d399"><animate attributeName="width" values="0;292;292" keyTimes="0;.72;1" dur="3s" repeatCount="indefinite"/></rect>
    <circle cx="31" cy="196" r="5" fill="#34d399"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/></circle>
    <text x="45" y="201" fill="#d1fae5" font-family="JetBrains Mono,Consolas,monospace" font-size="12">8 / 8 RELEASE GATES GREEN</text>
  </g>
</svg>
